# =============================================================================
# coturn TURN server configuration for Dograh WebRTC
# =============================================================================
# TURN is essential for WebRTC calls to succeed behind symmetric NATs.
# Uses time-limited HMAC-SHA1 credentials (TURN REST API).
# The static-auth-secret must match TURN_SECRET in /opt/dograh/.env
# =============================================================================

listening-port=3478
tls-listening-port=5349

# Use fingerprint for STUN messages
fingerprint

# Long-term credential mechanism with shared secret
lt-cred-mech
use-auth-secret

# This is replaced at runtime by the TURN_SECRET env var.
# coturn reads it as a literal — set it in docker-compose env or mount a
# config with the actual secret value.
# For docker, we'll use envsubst or set directly in .env
static-auth-secret=REPLACE_WITH_TURN_SECRET

realm=voice.salespyper.com

# Resource limits
total-quota=100
stale-nonce=600

# Security
no-multicast-peers
no-cli
